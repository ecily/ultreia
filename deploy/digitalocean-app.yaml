name: ultreia-backend
region: fra
domains:
  - domain: api.ultreia.app
    type: PRIMARY
services:
  - name: api
    source_dir: backend
    github:
      repo: ecily/ultreia
      branch: main
      deploy_on_push: true
    build_command: npm ci
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/ready
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: ULTREIA_MODE
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_DB_NAME
        value: ultreia_production
      - key: CORS_ORIGINS
        value: https://www.ultreia.app,https://ultreia.app
      - key: PUSH_TEST_ENABLED
        value: "false"
      - key: HEARTBEAT_TTL_SECONDS
        value: "604800"
      - key: DIAGNOSTIC_TTL_SECONDS
        value: "2592000"
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: EXPO_PROJECT_ID
        scope: RUN_TIME
        type: SECRET
      - key: EXPO_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: PUSH_TEST_KEY
        scope: RUN_TIME
        type: SECRET
