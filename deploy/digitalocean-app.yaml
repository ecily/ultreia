name: ultreia-backend
region: fra
domains:
  - domain: api.ultreia.app
    type: PRIMARY
services:
  - name: api
    source_dir: /
    github:
      repo: ecily/ultreia
      branch: main
      deploy_on_push: true
    build_command: npm --prefix backend ci
    run_command: npm --prefix backend start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/ready
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: ULTREIA_MODE
        value: production
      - key: PORT
        value: "3000"
      - key: COMMIT_SHA
        value: ${_self.COMMIT_HASH}
      - key: MONGODB_DB_NAME
        value: ultreia_production
      - key: CORS_ORIGINS
        value: https://www.ultreia.app,https://ultreia.app
      - key: PUSH_TEST_ENABLED
        value: "false"
      - key: ALLOW_LOCAL_TEST_SCOPE
        value: "true"
      - key: AUTH_PUBLIC_BASE_URL
        value: https://ultreia.app/auth/verify
      - key: MAIL_PROVIDER
        value: microsoft
      - key: MICROSOFT_GRAPH_TIMEOUT_MS
        value: "10000"
      - key: GOOGLE_PLACES_TIMEOUT_MS
        value: "8000"
      - key: HEARTBEAT_TTL_SECONDS
        value: "604800"
      - key: DIAGNOSTIC_TTL_SECONDS
        value: "2592000"
      - key: MONGODB_URI
        scope: RUN_TIME
        type: SECRET
      - key: EXPO_PROJECT_ID
        scope: RUN_TIME
        type: SECRET
      - key: EXPO_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: PUSH_TEST_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MICROSOFT_TENANT_ID
        scope: RUN_TIME
        type: SECRET
      - key: MICROSOFT_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: MICROSOFT_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_FROM
        scope: RUN_TIME
        type: SECRET
      - key: GOOGLE_PLACES_API_KEY
        scope: RUN_TIME
        type: SECRET
